name: Build Android APK and iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Auto-generate Android Scaffold & Dependencies
        run: |
          flutter create . --org com.example --project-name clap_to_find --platforms android
          flutter pub get

      - name: Build Debug APK (Testing App)
        run: flutter build apk --debug

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-testing-apk
          path: build/app/outputs/flutter-apk/*.apk
